{{- with . }}{{ if gt .TotalPages 1 }}
<nav aria-label="Pages">
  <ul class="pager">
    {{- with .Prev }}<li><a href="{{ .URL }}" aria-label="Previous page">←</a></li>{{ end }}
    {{- range .Pagers }}
    <li>{{ if eq .PageNumber $.PageNumber }}<span aria-current="page">{{ .PageNumber }}</span>{{ else }}<a href="{{ .URL }}">{{ .PageNumber }}</a>{{ end }}</li>
    {{- end }}
    {{- with .Next }}<li><a href="{{ .URL }}" aria-label="Next page">→</a></li>{{ end }}
  </ul>
</nav>
{{- end }}{{ end -}}
