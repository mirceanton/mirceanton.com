# Replaces the image's /etc/nginx/conf.d/default.conf. Same as the stock file (one IPv4 listener on
# 8080, files from /usr/share/nginx/html), plus the site's own 404 page instead of nginx's.
server {
    listen       8080;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   404              /404.html;
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
    location = /404.html {
        root   /usr/share/nginx/html;
        internal;
    }
}
